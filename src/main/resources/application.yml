spring:
  application:
    name: lab-management-system
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    time-zone: UTC
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate.jdbc.time_zone: UTC
  messages:
    basename: ValidationMessages
    encoding: UTF-8
  thymeleaf:
    check-template-location: false
    encoding: UTF-8

server:
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
  servlet:
    session:
      timeout: ${LAB_SESSION_TIMEOUT:30m}

management:
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
  endpoints:
    web:
      exposure:
        include: health

logging:
  pattern:
    level: "%5p [traceId=%X{traceId:-}]"
