<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
<th:block th:fragment="header">
    <button class="sidebar-toggle" type="button" aria-controls="app-sidebar" aria-expanded="false"
            aria-label="Mở menu điều hướng" data-sidebar-toggle>
        <svg class="sidebar-menu-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="M4 7h16M4 12h16M4 17h16"></path>
        </svg>
        <svg class="sidebar-close-icon" aria-hidden="true" viewBox="0 0 24 24">
            <path d="m6 6 12 12M18 6 6 18"></path>
        </svg>
    </button>
    <header class="app-header" id="app-sidebar" data-sidebar>
        <div class="header-inner">
            <a class="brand" th:href="@{/home}">
                <span class="brand-mark" aria-hidden="true">
                    <svg viewBox="0 0 24 24"><path d="M9 3h6M10 3v5l-5 9a2 2 0 0 0 1.7 3h10.6a2 2 0 0 0 1.7-3l-5-9V3M8 14h8"></path></svg>
                </span>
                <span class="nav-label">Quản lý phòng lab</span>
            </a>
            <nav class="main-nav" aria-label="Điều hướng chính">
                <a th:attr="aria-current=${currentPath == '/' or currentPath == '/home' ? 'page' : null}"
                   th:href="@{/home}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="m3 11 9-8 9 8M5 10v10h14V10M9 20v-6h6v6"></path></svg>
                    <span class="nav-label">Trang chủ</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/catalog/rooms') ? 'page' : null}"
                   th:href="@{/catalog/rooms}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 21V5a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v16M8 7h2m4 0h2M8 11h2m4 0h2M8 15h2m4 0h2M2 21h20"></path></svg>
                    <span class="nav-label">Phòng</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/catalog/devices') ? 'page' : null}"
                   th:href="@{/catalog/devices}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v11H4zM8 20h8M12 16v4"></path></svg>
                    <span class="nav-label">Thiết bị</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/registrations') ? 'page' : null}"
                   th:href="@{/registrations}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M7 3h10v4H7zM6 5H4v16h16V5h-2M8 12h8M8 16h6"></path></svg>
                    <span class="nav-label">Phiếu</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/sessions') ? 'page' : null}"
                   th:href="@{/sessions}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 6h16v14H4zM8 3v6m8-6v6M4 10h16"></path></svg>
                    <span class="nav-label">Phiên</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/incidents') ? 'page' : null}"
                   th:href="@{/incidents}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3 2.5 20h19zM12 9v5m0 3h.01"></path></svg>
                    <span class="nav-label">Sự cố</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/schedule/') ? 'page' : null}"
                   th:href="@{/schedule/calendar}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 5h16v16H4zM8 3v4m8-4v4M4 10h16M8 14h2m4 0h2m-8 3h2"></path></svg>
                    <span class="nav-label">Lịch</span>
                </a>
                <a th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/notifications') ? 'page' : null}"
                   th:href="@{/notifications}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M18 9a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M10 21h4"></path></svg>
                    <span class="nav-label">Thông báo</span>
                </a>
                <a th:if="${navManager}"
                   th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/dashboard') ? 'page' : null}"
                   th:href="@{/dashboard}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M4 13h6v8H4zM14 3h6v18h-6zM4 3h6v6H4z"></path></svg>
                    <span class="nav-label">Dashboard</span>
                </a>
                <details class="nav-menu" th:if="${navManager}"
                         th:classappend="${#strings.startsWith(currentPath ?: '', '/admin/users') or #strings.startsWith(currentPath ?: '', '/maintenances') or #strings.startsWith(currentPath ?: '', '/admin-blocks') or #strings.startsWith(currentPath ?: '', '/catalog/room-groups') or #strings.startsWith(currentPath ?: '', '/catalog/device-types')} ? ' nav-menu-active'">
                    <summary>
                        <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a3 3 0 1 0 0 6 3 3 0 0 0 0-6M5 21v-2a5 5 0 0 1 5-5h4a5 5 0 0 1 5 5v2M18 8l1 1 2-2"></path></svg>
                        <span class="nav-label">Quản trị</span>
                    </summary>
                    <div class="nav-menu-panel">
                        <a th:href="@{/admin/users}"><span class="nav-label">Quản lý tài khoản</span></a>
                        <a th:href="@{/maintenances}"><span class="nav-label">Bảo trì</span></a>
                        <a th:href="@{/admin-blocks}"><span class="nav-label">Lịch chặn</span></a>
                        <a th:href="@{/catalog/room-groups}"><span class="nav-label">Nhóm phòng</span></a>
                        <a th:href="@{/catalog/device-types}"><span class="nav-label">Loại thiết bị</span></a>
                    </div>
                </details>
                <a class="nav-profile"
                   th:attr="aria-current=${#strings.startsWith(currentPath ?: '', '/profile') ? 'page' : null}"
                   th:href="@{/profile}">
                    <svg class="nav-icon" aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3a4 4 0 1 0 0 8 4 4 0 0 0 0-8M4 21a8 8 0 0 1 16 0"></path></svg>
                    <span class="nav-label">Hồ sơ</span>
                </a>
            </nav>
        </div>
    </header>
    <div class="sidebar-scrim" aria-hidden="true" data-sidebar-dismiss></div>
    <script defer th:src="@{/js/app-ui.js}"></script>
</th:block>
</body>
</html>
