<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Loại thiết bị</title>
    <link rel="stylesheet" th:href="@{/css/catalog.css}">
</head>
<body>
<a class="skip-link" href="#main-content">Bỏ qua điều hướng</a>
<header class="app-header">
    <div class="header-inner">
        <a class="brand" th:href="@{/catalog/rooms}">Quản lý phòng lab</a>
        <nav class="main-nav" aria-label="Điều hướng danh mục">
            <a th:href="@{/catalog/rooms}">Phòng</a>
            <a th:href="@{/catalog/devices}">Thiết bị</a>
            <a th:href="@{/catalog/room-groups}">Nhóm phòng</a>
            <a aria-current="page" th:href="@{/catalog/device-types}">Loại thiết bị</a>
        </nav>
    </div>
</header>
<main class="page-shell" id="main-content" tabindex="-1">
    <div class="page-heading">
        <div>
            <h1>Loại thiết bị</h1>
            <p class="subtitle">Cấu hình yêu cầu giảng viên hướng dẫn và khả năng di động của từng loại.</p>
        </div>
    </div>
    <p class="message message-success" role="status" th:if="${success}" th:text="${success}"></p>
    <p class="message message-error" role="alert" th:if="${error}" th:text="${error}"></p>
    <section class="panel" aria-labelledby="type-form-heading">
        <h2 id="type-form-heading" th:text="${typeForm.originalId == null ? 'Thêm loại thiết bị' : 'Cập nhật loại thiết bị'}"></h2>
        <form method="post" th:action="@{/catalog/device-types}" th:object="${typeForm}">
            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
            <input th:field="*{originalId}" type="hidden">
            <div class="message message-error" role="alert" th:if="${#fields.hasGlobalErrors()}">
                <p th:each="item : ${#fields.globalErrors()}" th:text="${item}"></p>
            </div>
            <div class="form-grid">
                <div class="field">
                    <label for="id">Mã loại <span aria-hidden="true">*</span></label>
                    <input id="id" th:field="*{id}" maxlength="50" required th:readonly="${typeForm.originalId != null}"
                           aria-describedby="type-id-error">
                    <p class="field-error" id="type-id-error" role="alert" th:errors="*{id}"></p>
                </div>
                <div class="field">
                    <label for="name">Tên loại <span aria-hidden="true">*</span></label>
                    <input id="name" th:field="*{name}" maxlength="150" required aria-describedby="type-name-error">
                    <p class="field-error" id="type-name-error" role="alert" th:errors="*{name}"></p>
                </div>
                <div class="field">
                    <label class="checkbox-field" for="instructorRequired">
                        <input id="instructorRequired" th:field="*{instructorRequired}" type="checkbox">
                        Yêu cầu giảng viên hướng dẫn
                    </label>
                </div>
                <div class="field">
                    <label class="checkbox-field" for="mobile">
                        <input id="mobile" th:field="*{mobile}" type="checkbox">
                        Là thiết bị di động
                    </label>
                </div>
                <div class="field field-wide">
                    <label for="description">Mô tả</label>
                    <textarea id="description" th:field="*{description}" maxlength="5000" aria-describedby="type-description-error"></textarea>
                    <p class="field-error" id="type-description-error" role="alert" th:errors="*{description}"></p>
                </div>
            </div>
            <div class="toolbar">
                <button type="submit" th:text="${typeForm.originalId == null ? 'Tạo loại thiết bị' : 'Lưu thay đổi'}"></button>
                <a class="button button-secondary" th:if="${typeForm.originalId != null}" th:href="@{/catalog/device-types}">Hủy sửa</a>
            </div>
        </form>
    </section>
    <div class="table-wrap" role="region" aria-label="Danh sách loại thiết bị" tabindex="0">
        <table>
            <thead>
            <tr><th scope="col">Mã</th><th scope="col">Tên loại</th><th scope="col">GVHD</th><th scope="col">Di động</th><th scope="col">Mô tả</th><th scope="col">Thao tác</th></tr>
            </thead>
            <tbody>
            <tr th:each="item : ${types}">
                <td th:text="${item.id}"></td>
                <td th:text="${item.name}"></td>
                <td th:text="${item.instructorRequired ? 'Có yêu cầu' : 'Không yêu cầu'}"></td>
                <td th:text="${item.mobile ? 'Có' : 'Không'}"></td>
                <td th:text="${item.description ?: '—'}"></td>
                <td>
                    <div class="actions">
                        <a class="button button-secondary" th:href="@{/catalog/device-types(edit=${item.id})}">Sửa</a>
                        <form class="inline-form" method="post" th:action="@{/catalog/device-types/{id}/delete(id=${item.id})}"
                              onsubmit="return confirm('Không thể xóa loại đang có thiết bị. Tiếp tục?')">
                            <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
                            <button class="button-danger" type="submit">Xóa</button>
                        </form>
                    </div>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(types)}"><td class="empty-state" colspan="6">Chưa có loại thiết bị.</td></tr>
            </tbody>
        </table>
    </div>
</main>
</body>
</html>
