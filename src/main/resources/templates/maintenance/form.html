<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Tạo bảo trì</title><link rel="stylesheet" th:href="@{/css/catalog.css}"></head>
<body><a class="skip-link" href="#main-content">Bỏ qua điều hướng</a><header class="app-header"><div class="header-inner"><a class="brand" th:href="@{/catalog/rooms}">Quản lý phòng lab</a><nav class="main-nav" aria-label="Điều hướng chính"><a th:href="@{/incidents}">Sự cố</a><a aria-current="page" th:href="@{/maintenances}">Bảo trì</a><a th:href="@{/profile}">Hồ sơ</a></nav></div></header>
<main class="page-shell" id="main-content" tabindex="-1"><div class="page-heading"><div><h1>Tạo phiếu bảo trì</h1><p class="subtitle">Mỗi phiếu chỉ gắn với một tài nguyên; sự cố nguồn là tùy chọn nhưng phải thuộc cùng tài nguyên.</p></div><a class="button button-secondary" th:href="@{/maintenances}">Về danh sách</a></div>
    <section class="panel" aria-labelledby="create-maintenance-heading"><h2 id="create-maintenance-heading">Thông tin bảo trì</h2><form method="post" th:action="@{/maintenances}" th:object="${maintenanceForm}"><input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden"><p class="message message-error" role="alert" th:if="${#fields.hasGlobalErrors()}" th:each="error : ${#fields.globalErrors()}" th:text="${error}"></p><div class="form-grid">
        <div class="field field-wide"><label for="resourceId">Tài nguyên</label><select id="resourceId" th:field="*{resourceId}" required th:attr="aria-invalid=${#fields.hasErrors('resourceId')}"><option value="">Chọn một tài nguyên</option><option th:each="item : ${resources}" th:value="${item.id}" th:text="|${item.type.name() == 'PHONG' ? 'Phòng' : 'Thiết bị'} · ${item.referenceId} — ${item.name}|"></option></select><p class="field-error" role="alert" th:errors="*{resourceId}"></p></div>
        <div class="field"><label for="incidentId">Mã sự cố nguồn (tùy chọn)</label><input id="incidentId" th:field="*{incidentId}" maxlength="50" th:attr="aria-invalid=${#fields.hasErrors('incidentId')}" placeholder="Ví dụ: SC-..."><p class="helper">Mỗi sự cố chỉ được dùng cho một phiếu bảo trì.</p><p class="field-error" role="alert" th:errors="*{incidentId}"></p></div>
        <div class="field"><label for="assigneeId">Người phụ trách</label><select id="assigneeId" th:field="*{assigneeId}" required th:attr="aria-invalid=${#fields.hasErrors('assigneeId')}"><option value="">Chọn cán bộ quản lý</option><option th:each="item : ${assignees}" th:value="${item.id}" th:text="|${item.id} — ${item.fullName}|"></option></select><p class="field-error" role="alert" th:errors="*{assigneeId}"></p></div>
        <div class="field field-wide"><label for="content">Nội dung bảo trì</label><textarea id="content" th:field="*{content}" maxlength="2000" required th:attr="aria-invalid=${#fields.hasErrors('content')}" placeholder="Hạng mục cần kiểm tra, sửa chữa hoặc thay thế"></textarea><p class="field-error" role="alert" th:errors="*{content}"></p></div>
    </div><div class="toolbar form-actions"><button type="submit">Tạo và chặn tài nguyên</button><a class="button button-secondary" th:href="@{/maintenances}">Hủy</a></div></form></section>
</main></body></html>
