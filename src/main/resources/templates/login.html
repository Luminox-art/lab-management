<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Đăng nhập</title>
</head>
<body>
<main>
    <h1>Đăng nhập</h1>
    <p role="alert" th:if="${param.error}">Thông tin đăng nhập không hợp lệ.</p>
    <p role="status" th:if="${param.logout}">Bạn đã đăng xuất.</p>
    <p role="alert" th:if="${param.expired}">Phiên đăng nhập đã hết hạn.</p>
    <form method="post" th:action="@{/login}">
        <input th:name="${_csrf.parameterName}" th:value="${_csrf.token}" type="hidden">
        <div>
            <label for="email">Email</label>
            <input id="email" name="email" type="email" autocomplete="username" required autofocus>
        </div>
        <div>
            <label for="password">Mật khẩu</label>
            <input id="password" name="password" type="password" autocomplete="current-password" required>
        </div>
        <button type="submit">Đăng nhập</button>
    </form>
    <p>Chưa có tài khoản? <a th:href="@{/register}">Đăng ký GV/SV</a></p>
</main>
</body>
</html>
